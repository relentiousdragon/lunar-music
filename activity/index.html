<!doctype html>
<html lang="en" data-viz-mode="auto" data-rpc-mode="full">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lunar Music</title>
  <link rel="stylesheet" href="/style.css?v=activity-14">
  <link rel="stylesheet" href="/transitions.css?v=activity-14">
</head>

<body>
  <div class="corner-glows" aria-hidden="true">
    <span class="corner-glow corner-tl"></span>
    <span class="corner-glow corner-tr"></span>
    <span class="corner-glow corner-bl"></span>
    <span class="corner-glow corner-br"></span>
  </div>
  <canvas id="visualizer" aria-hidden="true"></canvas>
  <main id="shell" class="shell">
    <header>
      <div class="brand"><img id="brand-avatar" alt=""><strong id="brand-name">LUNAR</strong></div>
      <div class="search-wrap">
        <input id="search" autocomplete="off" maxlength="120" placeholder="Search and add to queue…">
        <div id="search-results" class="search-results"></div>
      </div>
      <div class="source-picker" id="source-picker">
        <button id="source-toggle" class="source-toggle" type="button" aria-haspopup="listbox" aria-expanded="false"
          disabled><img id="source-icon" src="/assets/emojis/headphones.webp" alt=""><span
            id="source-label">Source</span><span class="source-chevron">⌄</span></button>
        <div id="source-menu" class="source-menu" role="listbox"></div>
      </div>
      <div class="panel-toggles">
        <button class="panel-toggle" id="toggle-queue" aria-label="Toggle queue" data-panel="queue">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
        </button>
        <button class="panel-toggle" id="toggle-lyrics" aria-label="Toggle lyrics" data-panel="lyrics">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </button>
        <button class="panel-toggle viz-mode-btn" id="viz-mode" aria-label="Visualizer mode">
          <svg class="viz-icon viz-icon-auto" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8v4l3 3" />
          </svg>
          <svg class="viz-icon viz-icon-wave" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M2 12c1.5-3 3-4.5 4.5-4.5S9 9 10.5 12 13 16.5 14.5 16.5 19 15 20.5 12 22 9 22 9" />
          </svg>
        </button>
        <button class="panel-toggle rpc-mode-btn" id="rpc-mode" aria-label="Rich Presence mode">
          <svg class="rpc-icon rpc-icon-full" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.9 19.1C1.9 16.1 1.9 11.3 4.9 8.3" />
            <path d="M7.8 16.2c-1.6-1.6-1.6-4.1 0-5.7" />
            <circle cx="12" cy="12" r="2" />
            <path d="M16.2 10.5c1.6 1.6 1.6 4.1 0 5.7" />
            <path d="M19.1 7.6c3 3 3 7.8 0 10.8" />
          </svg>
          <svg class="rpc-icon rpc-icon-limited" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.8 16.2c-1.6-1.6-1.6-4.1 0-5.7" />
            <circle cx="12" cy="12" r="2" />
            <path d="M16.2 10.5c1.6 1.6 1.6 4.1 0 5.7" />
          </svg>
          <svg class="rpc-icon rpc-icon-off" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="2" x2="22" y2="22" />
            <circle cx="12" cy="12" r="2" />
          </svg>
        </button>
      </div>
      <div id="connection" class="connection" aria-live="polite"></div>
    </header>
    <section class="layout">
      <aside class="overlay-panel queue-overlay" id="queue-overlay">
        <div class="overlay-head"><span>QUEUE</span><small id="queue-count">0 UP NEXT</small></div>
        <div id="queue" class="queue"></div>
      </aside>
      <section class="now-playing">
        <div class="record-stage">
          <div class="halo"></div>
          <div class="ring ring-a"></div>
          <div class="ring ring-b"></div>
          <div id="record" class="record">
            <div id="record-art" class="record-art"></div>
            <div class="label"><span>LUNAR</span></div><i></i>
          </div>
        </div>
        <div class="track-info">
          <div id="track-source" class="eyebrow">WAITING FOR MUSIC</div>
          <h1 id="track-title">Nothing playing</h1>
          <p id="track-artist">Start a track from Discord or this Activity.</p>
          <div class="progress">
            <div id="progress-fill"></div>
          </div>
          <div class="timing"><span id="position">00:00</span><span id="duration">00:00</span></div>
          <div id="details" class="details"></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="btn-back" aria-label="Previous track" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button class="ctrl-btn ctrl-main" id="btn-play" aria-label="Play/Pause" disabled>
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button class="ctrl-btn" id="btn-skip" aria-label="Next track" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
        </div>
        <div id="break-indicator" class="break-indicator">
          <div class="break-pulse"></div>
          <div class="break-content">
            <svg class="break-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
              <path d="M8 3 A4 4 0 0 1 4 7" stroke-dasharray="2 2" />
              <path d="M16 3 A4 4 0 0 0 20 7" stroke-dasharray="2 2" />
            </svg>
            <div class="break-text">
              <span class="break-title">Reconnecting</span>
              <span class="break-subtitle" id="break-subtitle">Please wait a moment…</span>
            </div>
          </div>
        </div>
        <div id="effects" class="effects"></div>
      </section>
      <aside class="overlay-panel lyrics-overlay" id="lyrics-overlay">
        <div class="overlay-head"><span>LYRICS</span><button class="lyrics-toggle" id="lyrics-auto"
            aria-label="Toggle auto-scroll" title="Auto-scroll on"><svg class="icon-on" width="12" height="12"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M12 5v14M5 12l7 7 7-7" />
            </svg><svg class="icon-off" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <circle cx="12" cy="12" r="9" stroke-dasharray="3 3" />
            </svg></button></div>
        <div id="lyrics" class="lyrics">
          <p class="idle">Lyrics appear here when available.</p>
        </div>
      </aside>
    </section>
  </main>
  <div id="voice-screen" class="voice-screen">
    <div class="voice-screen-content">
      <svg class="voice-screen-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" y1="19" x2="12" y2="23" />
        <line x1="8" y1="23" x2="16" y2="23" />
      </svg>
      <h2 id="voice-screen-title">Voice Channel Required</h2>
      <p id="voice-screen-message">Open this Activity from a voice channel to control the music.</p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js?v=activity-19"></script>
</body>

</html>
